<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta charset="utf-8" />
  <title>Categories</title>

  <style>
    :root {
      /* Default starting position for the grid (in vh). JS will adjust it to ensure fit */
      --grid-top-vh: 35;

      /* Default tile aspect ratio (height = TILE_ASPECT_PERCENT% of width) */
      --tile-aspect-percent: 62;

      /* Spacing between tiles */
      --tile-gap: 14px;

      /* Max width of content on larger screens */
      --max-width: 560px;

      /* Bottom safe margin in px (JS uses to ensure grid doesn't touch bottom) */
      --bottom-margin-px: 28px;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: transparent;
      overflow: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* =================================
       VIDEO BACKGROUND
    ================================= */
    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: fill;
      object-position: top center;
      z-index: 1;
      pointer-events: none;
      display: block;
    }

    /* =================================
       BACK BUTTON
    ================================= */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 9999;
      padding: 10px 18px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .back-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    /* =================================
       GRID AREA
    ================================= */
    .grid-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      box-sizing: border-box;
      padding: 0 14px 34px 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--tile-gap);
      width: 100%;
      box-sizing: border-box;
      align-items: stretch;
      justify-items: center;
    }

    /* Tile — aspect controlled by CSS variable */
    .tile {
      width: 100%;
      height: 0;
      padding-bottom: calc(var(--tile-aspect-percent) * 1%);
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, box-shadow .12s ease;
      display: block;
    }

    .tile:active {
      transform: translateY(2px) scale(.997);
    }

    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 34px rgba(3, 12, 28, 0.3);
    }

    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    @media (max-width: 420px) {
      :root {
        --tile-aspect-percent: 70;
        --tile-gap: 10px;
      }
      .grid {
        padding: 0 6px;
      }
    }

    @media (orientation: landscape) and (max-height: 420px) {
      :root {
        --tile-aspect-percent: 50;
      }
      .tile {
        border-radius: 10px;
      }
    }
  </style>
</head>
<body>

  <a href="../index.html" class="back-btn">← Back</a>

  <div class="page">
    <!-- Background Video -->
    <video
        id="bgVideo"
        data-bg-video
        poster="../ui/Explore_poster.webp"
      class="bg-video"
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto">
      <source src="../ui/Explore.mp4" type="video/mp4" />
      Your browser does not support HTML5 video.
    </video>

    <!-- Grid Area -->
    <div class="grid-wrap">
      <div id="grid" class="grid" style="margin-top: calc(var(--grid-top-vh) * 1vh);">
        <div class="tile" id="btn-planet"><img src="../ui/planet_button.webp" alt="planet" /></div>
        <div class="tile" id="btn-navgrah"><img src="../ui/navgrah_button.webp" alt="navgrah" /></div>
        <div class="tile" id="btn-zodiac"><img src="../ui/zodiac_button.webp" alt="Zodiac" /></div>
        <div class="tile" id="btn-combination"><img src="../ui/combination_button.webp" alt="combination" /></div>
      </div>
    </div>
  </div>

  <script>

    /* =================================
       TILE NAVIGATION
    ================================= */
    const mapping = {
      'btn-planet': 'planets.html',
      'btn-navgrah': 'navgrah.html',
      'btn-zodiac': 'zodiac.html',
      'btn-combination': 'combination.html'
    };

    Object.keys(mapping).forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('click', () => window.location.href = mapping[id]);
      el.addEventListener('touchstart', () => el.classList.add('pressed'), { passive: true });
      el.addEventListener('touchend', () => el.classList.remove('pressed'), { passive: true });
    });

    /* =================================
       LAYOUT COMPUTATION (GRID FIT)
    ================================= */
    const DEFAULT_GRID_TOP_VH = 35;
    const MIN_GRID_TOP_VH = 18;
    const BOTTOM_MARGIN_PX = 28;
    const TILE_ASPECT_PERCENT = 62;

    function updateGridFit() {
      document.documentElement.style.setProperty('--tile-aspect-percent', TILE_ASPECT_PERCENT);

      const grid = document.getElementById('grid');
      if (!grid) return;

      const vw = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
      const vh = Math.max(document.documentElement.clientHeight, window.innerHeight || 0);

      const maxWidth = Math.min(vw - 28, parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--max-width')) || vw);
      const gridWidth = Math.min(vw - 28, maxWidth);

      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-gap')) || 14;
      const tileWidth = (gridWidth - gap) / 2;
      const rows = Math.ceil(4 / 2); // 4 category tiles total

      const tileHeight = tileWidth * (TILE_ASPECT_PERCENT / 100);
      const totalGridHeight = (rows * tileHeight) + ((rows - 1) * gap);

      const desiredTopPx = Math.max((vh - BOTTOM_MARGIN_PX - totalGridHeight), (MIN_GRID_TOP_VH / 100) * vh);
      let gridTopVh = (desiredTopPx / vh) * 100;

      gridTopVh = Math.min(gridTopVh, DEFAULT_GRID_TOP_VH);
      gridTopVh = Math.max(gridTopVh, MIN_GRID_TOP_VH);

      document.documentElement.style.setProperty('--grid-top-vh', gridTopVh);
      grid.style.marginTop = `calc(${gridTopVh} * 1vh)`;
    }

    updateGridFit();
    window.addEventListener('resize', updateGridFit);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateGridFit, 120);
    });
  </script>
    <script src="../js/video-start.js"></script>
</body>
</html>
