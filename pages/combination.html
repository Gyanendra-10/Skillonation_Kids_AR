<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Combination Menu</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #a5b4fc;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #818cf8;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            overflow: hidden;
        }

        /* Fullscreen responsive video background */
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;           /* correct height on mobile browsers */
            object-fit: cover;
            object-position: center;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* Dark overlay: change the 0.25 to adjust, or set to 0 to remove */
        .video-dim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.25);
            z-index: 1;
            pointer-events: none;
        }

        /* Menu scroll area sized for small screens */
        #menu-container {
            max-height: 70vh;
            max-height: 70dvh;
        }
    </style>
</head>

<body class="flex justify-center items-center relative">

    <!-- Background Video: MP4 (H.264) first for iOS, WebM fallback -->
    <video
        id="bgVideo"
        data-bg-video
        poster="../ui/combinations_poster.webp"
        class="background-video"
        autoplay
        muted
        loop
        playsinline
        webkit-playsinline
        preload="auto">
        <source src="../ui/combinations.mp4" type="video/mp4" />
        <source src="../ui/combinations.webm" type="video/webm" />
        Your browser does not support HTML5 video.
    </video>

    <!-- Dark backdrop overlay -->
    <div class="video-dim"></div>

    <!-- Back Button -->
    <a href="categories.html"
       class="fixed top-6 left-6 z-20 bg-gray-900/80 backdrop-blur-md text-white font-semibold py-2 px-4 rounded-xl shadow-md transition-all duration-200 ease-in-out hover:bg-indigo-600 hover:text-white active:scale-95">
        ← Back
    </a>

    <!-- Menu Container -->
    <div class="relative z-10 w-full max-w-xs sm:max-w-sm px-4">
        <div id="menu-container" class="overflow-y-auto custom-scrollbar pr-2">
            <ul class="space-y-4"></ul>
        </div>
    </div>

<script>

// --- 2. Menu Items ---
const combinations = [
    {
        name: "Solar System",
        file: "solarsystem"
    },
    {
        name: "9 Houses (Navgrah)",
        file: "navgrah"
    }
];

// Sort alphabetically
combinations.sort((a, b) => a.name.localeCompare(b.name));

const menuList = document.querySelector('#menu-container ul');

function createMenuItems() {
    combinations.forEach(item => {
        const li = document.createElement('li');
        const a = document.createElement('a');

        a.textContent = item.name;
        a.href = `combination/${item.file}.html`;
        a.className =
            "block w-full text-center py-3.5 px-5 bg-indigo-600/90 backdrop-blur-sm text-white font-semibold rounded-xl shadow-md transform transition-all duration-200 ease-in-out hover:bg-indigo-500 hover:shadow-lg active:scale-95";

        li.appendChild(a);
        menuList.appendChild(li);
    });
}

createMenuItems();
</script>

    <script src="../js/video-start.js"></script>
</body>
</html>
