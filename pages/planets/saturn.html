<!DOCTYPE html>
<!-- Generated by tools/ar-pages/build.py from tools/ar-pages/template.html. Edit those, not this file. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Saturn AR - Skillonation Kids</title>

  <!-- Debugger: only loads when the page is opened with ?debug -->
  <script>
    if (/[?&]debug\b/.test(location.search)) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/eruda"><\/script><script>eruda.init();<\/script>');
    }
  </script>

  <!-- Stable pairing: A-Frame 1.4.2 + MindAR 1.2.5 -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      /* No background here: MindAR's camera video sits behind the page */
    }

    #ar-scene {
      width: 100%;
      height: 100%;
    }

    .ui-button {
      position: absolute;
      z-index: 100;
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .ui-button:hover {
      background: rgba(0, 0, 0, 0.95);
    }

    #knowMoreBtn { top: calc(20px + env(safe-area-inset-top)); left: 20px; }
    #backBtn     { top: calc(20px + env(safe-area-inset-top)); right: 20px; }

    #rotateBtn {
      bottom: calc(25px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: none;
    }

    /* "Scan the X Card" label: sits above the Rotate button's spot, never over the camera centre */
    #scanLabel {
      position: fixed;
      z-index: 100;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      box-sizing: border-box;
      padding: 12px 22px;
      border-radius: 24px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      display: none;
    }

    /* iOS FIX: full-screen tap-to-start overlay */
    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    #startTitle { font-size: 24px; font-weight: bold; }

    #startBtn {
      padding: 16px 32px;
      border: none;
      border-radius: 30px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
    }

    #startMsg { font-size: 13px; opacity: 0.8; max-width: 320px; }
  </style>
</head>

<body>

  <!-- iOS FIX: camera must be started from a user tap -->
  <div id="startOverlay">
    <div id="startTitle">Scan the Saturn Card</div>
    <button id="startBtn">Start AR</button>
    <div id="startMsg">Tap Start AR, then point your camera at the Saturn card</div>
  </div>

  <button id="knowMoreBtn" class="ui-button">Know More</button>
  <button id="backBtn" class="ui-button">&larr; Back</button>
  <button id="rotateBtn" class="ui-button">Rotate Saturn</button>
  <div id="scanLabel" role="status" aria-live="polite">Scan the Saturn Card</div>

  <!-- iOS FIX: autoStart is false; uiScanning off because #scanLabel replaces it -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ../../mind/planet/saturn.mind; autoStart: false; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 8"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <a-asset-item id="arModelAsset" src="../../model/Saturn.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target stays empty; MindAR writes its pose here -->
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- Container lives at scene root and follows the target's world pose -->
    <a-entity id="smoothContainer" visible="false">
      <a-gltf-model
        id="arModel"
        src="#arModelAsset"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
      ></a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ROTATE_TEXT = "Rotate Saturn";
      const KNOW_MORE_URL = "https://science.nasa.gov/saturn/facts/";
      const BACK_URL = "../planets.html";

      const sceneEl = document.querySelector("a-scene");
      const target = document.querySelector("#target");
      const smoothContainer = document.querySelector("#smoothContainer");
      const arModel = document.querySelector("#arModel");

      const rotateBtn = document.querySelector("#rotateBtn");
      const knowMoreBtn = document.querySelector("#knowMoreBtn");
      const backBtn = document.querySelector("#backBtn");
      const scanLabel = document.querySelector("#scanLabel");

      const startOverlay = document.querySelector("#startOverlay");
      const startBtn = document.querySelector("#startBtn");
      const startMsg = document.querySelector("#startMsg");

      let arStarted = false;
      let targetVisible = false;
      let rotateModel = false;
      let firstFrame = true;

      // ---------- iOS camera start ----------
      function explainError(err) {
        const name = (err && err.name) || "";
        if (!window.isSecureContext || !navigator.mediaDevices) {
          return "Camera needs HTTPS. Open this page with an https:// link.";
        }
        if (name === "NotAllowedError") {
          return "Camera permission was denied. Enable it in Settings > Safari > Camera, then reload.";
        }
        if (name === "NotReadableError") {
          return "Camera is in use by another app. Close it and try again.";
        }
        if (name === "OverconstrainedError") {
          return "Rear camera not available on this device.";
        }
        return "Could not start camera: " + (err && err.message ? err.message : err);
      }

      async function startAR() {
        startBtn.disabled = true;
        startBtn.innerText = "Starting...";
        startMsg.innerText = "Allow camera access when asked";

        if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          startBtn.disabled = false;
          startBtn.innerText = "Try Again";
          startMsg.innerText = explainError(null) +
            " If you opened this from WhatsApp/Instagram, open it in Safari instead.";
          return;
        }

        try {
          const arSystem = sceneEl.systems["mindar-image-system"];
          await arSystem.start();

          // Safety net for iOS: make sure the camera <video> is inline + playing
          const video = document.querySelector("video");
          if (video) {
            video.setAttribute("playsinline", "");
            video.setAttribute("webkit-playsinline", "");
            video.muted = true;
            video.play().catch(() => {});
          }

          arStarted = true;
          startOverlay.remove();
          if (!targetVisible) scanLabel.style.display = "block";
        } catch (err) {
          console.error("AR start failed:", err);
          startBtn.disabled = false;
          startBtn.innerText = "Try Again";
          startMsg.innerText = explainError(err);
        }
      }

      if (sceneEl.hasLoaded) {
        startBtn.addEventListener("click", startAR);
      } else {
        startBtn.disabled = true;
        startBtn.innerText = "Loading...";
        sceneEl.addEventListener("loaded", () => {
          startBtn.disabled = false;
          startBtn.innerText = "Start AR";
          startBtn.addEventListener("click", startAR);
        });
      }

      // Release the camera when leaving the page
      window.addEventListener("pagehide", () => {
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) arSystem.stop();
      });

      // ---------- Target events ----------
      target.addEventListener("targetFound", () => {
        targetVisible = true;
        firstFrame = true;
        smoothContainer.setAttribute("visible", true);
        scanLabel.style.display = "none";
        rotateBtn.style.display = "block";
      });

      target.addEventListener("targetLost", () => {
        targetVisible = false;
        smoothContainer.setAttribute("visible", false);
        rotateBtn.style.display = "none";
        if (arStarted) scanLabel.style.display = "block";
      });

      // ---------- Smoothing (reads target's WORLD matrix) ----------
      const smoothFactor = 0.15;
      const tPos = new THREE.Vector3();
      const tQuat = new THREE.Quaternion();
      const tScale = new THREE.Vector3();

      function animate() {
        if (targetVisible) {
          const t = target.object3D;
          const s = smoothContainer.object3D;
          t.updateMatrixWorld(true);
          t.matrixWorld.decompose(tPos, tQuat, tScale);

          if (firstFrame) {
            s.position.copy(tPos);
            s.quaternion.copy(tQuat);
            s.scale.copy(tScale);
            firstFrame = false;
          } else {
            s.position.lerp(tPos, smoothFactor);
            s.quaternion.slerp(tQuat, smoothFactor);
            s.scale.lerp(tScale, smoothFactor);
          }
        }

        if (rotateModel && arModel.object3D) {
          arModel.object3D.rotation.y += 0.005;
        }

        requestAnimationFrame(animate);
      }

      animate();

      // ---------- Buttons ----------
      rotateBtn.addEventListener("click", () => {
        rotateModel = !rotateModel;
        rotateBtn.innerText = rotateModel ? "Stop Rotation" : ROTATE_TEXT;
      });

      knowMoreBtn.addEventListener("click", () => {
        window.open(KNOW_MORE_URL, "_blank");
      });

      backBtn.addEventListener("click", () => {
        window.location.href = BACK_URL;
      });
    });
  </script>
</body>
</html>
